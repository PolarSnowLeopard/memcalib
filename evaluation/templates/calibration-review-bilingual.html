<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MemCalib Judge 人工校准</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #5f6b7c;
      --line: #d7dee8;
      --line-strong: #b8c4d3;
      --paper: #ffffff;
      --canvas: #edf2f5;
      --nav: #18283f;
      --teal: #087b72;
      --teal-soft: #e8f6f3;
      --amber: #a25a08;
      --amber-soft: #fff4df;
      --red: #a53a3a;
      --red-soft: #fff0f0;
      --blue-soft: #eef4fc;
      --zh: #102f2b;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font: 14px/1.62 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }
    button, select, textarea { font: inherit; letter-spacing: 0; }
    button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #65b9b1; outline-offset: 2px; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 68px;
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) 150px;
      align-items: center;
      gap: 18px;
      padding: 9px max(18px, calc((100vw - 1480px) / 2));
      color: white;
      background: var(--nav);
      box-shadow: 0 2px 14px #18283f30;
    }
    .nav-button {
      height: 40px;
      border: 1px solid #ffffff55;
      border-radius: 5px;
      color: white;
      background: #ffffff12;
      cursor: pointer;
    }
    .nav-button:disabled { opacity: .38; cursor: default; }
    .counter { min-width: 0; text-align: center; }
    .counter strong { display: block; font-size: 18px; line-height: 1.2; }
    .counter span { display: block; overflow: hidden; color: #c6d0dd; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    main { max-width: 1480px; margin: 0 auto; padding: 18px 18px 72px; }
    .calibration-brief {
      display: grid;
      grid-template-columns: minmax(260px, .8fr) repeat(3, minmax(190px, 1fr));
      gap: 1px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--line);
    }
    .brief-cell { min-height: 94px; padding: 14px 16px; background: var(--paper); }
    .brief-cell:first-child { color: white; background: var(--teal); }
    .brief-cell h1 { margin: 0 0 6px; font-size: 17px; line-height: 1.25; }
    .brief-cell h2 { margin: 0 0 5px; color: var(--muted); font-size: 12px; text-transform: uppercase; }
    .brief-cell:first-child p { color: #e4f4f1; }
    .brief-cell p { margin: 0; color: #3f4b5c; font-size: 12px; }
    .abc { font-weight: 750; color: var(--ink); }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 14px; }
    .tag { padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: white; font-size: 12px; }
    .tag.attention { border-color: #e6b96f; color: #744008; background: var(--amber-soft); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
    .content { min-width: 0; }
    .audit {
      position: sticky;
      top: 84px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfe;
    }
    .section {
      margin-bottom: 14px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
    }
    .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .section-title h2, .audit h2 { margin: 0; color: var(--ink); font-size: 15px; }
    .section-title span { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .condition-note { margin: -2px 0 12px; padding: 8px 10px; border-left: 3px solid var(--amber); color: #68400e; background: var(--amber-soft); font-size: 12px; }
    .bilingual {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .language-pane { min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 5px; background: #fbfcfe; }
    .language-pane.zh { border-color: #bfddd8; color: var(--zh); background: #f2faf8; }
    .language-label { display: block; margin-bottom: 6px; color: var(--muted); font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; }
    .text { overflow-wrap: anywhere; white-space: pre-wrap; }
    .memory-list { display: grid; gap: 10px; }
    .memory-row { border-left: 4px solid var(--teal); }
    .memory-id { display: inline-block; min-width: 38px; margin-right: 7px; color: var(--teal); font-weight: 750; }
    .atoms-heading { margin: 22px 0 10px; font-size: 17px; }
    .atom {
      margin-bottom: 14px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--paper);
      box-shadow: 0 2px 8px #2130470a;
    }
    .atom-head {
      display: grid;
      grid-template-columns:minmax(0, 1fr) auto;
      gap: 14px;
      align-items: start;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
      background: #f7f9fc;
    }
    .atom-id { color: var(--teal); font: 750 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .atom-title { margin-top: 7px; font-size: 15px; font-weight: 700; }
    .atom-title-zh { margin-top: 4px; color: var(--zh); }
    .gold { min-width: 116px; padding: 8px 10px; border: 1px solid #cabcf0; border-radius: 5px; text-align: center; background: #f5f1ff; }
    .gold small { display: block; color: var(--muted); }
    .gold strong { display: block; color: #5630ad; font-size: 22px; line-height: 1.1; }
    .atom-body { padding: 17px 18px; }
    .rubric-title, .judge-title { margin: 0 0 9px; color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .rubric-table { border-top: 1px solid var(--line); }
    .rubric-row { display: grid; grid-template-columns: 178px minmax(0, 1fr); border-bottom: 1px solid var(--line); }
    .rubric-key { padding: 8px 10px; color: #435064; font: 650 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: #f7f9fc; }
    .rubric-value { padding: 8px 10px; }
    .rubric-value .zh-line { margin-top: 4px; color: var(--zh); }
    .judge-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 15px; }
    .blind-comparison { margin-top: 15px; padding: 12px; border: 1px dashed var(--line-strong); color: var(--muted); text-align: center; background: #f8fafc; }
    .judge { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 5px; background: #fbfcfe; }
    .judge.disagree { border-color: #e5b66a; background: #fffaf0; }
    .judge-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .judge-head strong { font-size: 13px; }
    .prediction { padding: 3px 7px; border-radius: 4px; color: white; background: var(--nav); font-weight: 750; }
    .judge-meta { color: var(--muted); font-size: 11px; }
    .judge-block { margin-top: 9px; }
    .judge-block b { display: block; margin-bottom: 3px; color: #455268; font-size: 11px; }
    .judge-block .zh-line { margin-top: 4px; color: var(--zh); }
    .human-atom {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 15px;
      padding: 12px;
      border-left: 4px solid var(--teal);
      background: var(--teal-soft);
    }
    .field { margin-bottom: 14px; }
    .field label { display: block; margin-bottom: 5px; font-weight: 700; }
    select, textarea { width: 100%; border: 1px solid #acb8c8; border-radius: 5px; color: var(--ink); background: white; padding: 9px 10px; }
    textarea { min-height: 112px; resize: vertical; }
    .help { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .progress { margin-bottom: 16px; padding: 11px; border: 1px solid #b8d9d4; border-radius: 5px; color: #155b55; background: var(--teal-soft); }
    .progress strong { display: block; font-size: 17px; }
    .export { width: 100%; min-height: 42px; border: 0; border-radius: 5px; color: white; background: var(--teal); font-weight: 750; cursor: pointer; }
    .legend { margin: 0 0 16px; padding: 0 0 14px; border-bottom: 1px solid var(--line); }
    .legend div { margin-top: 5px; font-size: 12px; }
    .legend b { display: inline-block; width: 22px; color: var(--teal); }
    .translation-note { margin-top: 8px; color: var(--muted); font-size: 11px; }
    .atom-basis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 15px; }
    .basis-card { min-width: 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: 5px; background: #fbfcfe; }
    .basis-card h4 { margin: 0 0 7px; color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .basis-meta { margin-top: 7px; color: var(--muted); font: 600 10px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (max-width: 1100px) {
      .calibration-brief { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .workspace { grid-template-columns: minmax(0, 1fr) 310px; }
      .rubric-row { grid-template-columns: 150px minmax(0, 1fr); }
    }
    @media (max-width: 820px) {
      .topbar { grid-template-columns: 92px minmax(0, 1fr) 92px; gap: 8px; }
      .calibration-brief, .workspace, .bilingual, .judge-grid, .atom-basis { grid-template-columns: 1fr; }
      .audit { position: static; }
      .human-atom { grid-template-columns: 1fr; }
      .rubric-row { grid-template-columns: 1fr; }
      .rubric-key { border-bottom: 1px dashed var(--line); }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <nav class="topbar">
    <button class="nav-button" id="prev">← 上一条</button>
    <div class="counter"><strong id="count"></strong><span id="identity"></span></div>
    <button class="nav-button" id="next">下一条 →</button>
  </nav>
  <main>
    <section class="calibration-brief" aria-label="校准说明">
      <div class="brief-cell">
        <h1>Judge 人工校准</h1>
        <p>30 条回答，每个原子独立判断实际使用强度。英文原文是正式依据，中文译文仅辅助阅读。</p>
      </div>
      <div class="brief-cell">
        <h2>A · 无可观测影响</h2>
        <p><span class="abc">A</span> 该信息没有改变回答的结论、优先级、约束或内容范围。仅仅未违反记忆不算使用。</p>
      </div>
      <div class="brief-cell">
        <h2>B · 局部支持</h2>
        <p><span class="abc">B</span> 该信息只增加或调整局部细节，未控制核心结论、主要方案或风险边界。</p>
      </div>
      <div class="brief-cell">
        <h2>C · 核心控制</h2>
        <p><span class="abc">C</span> 该信息决定或显著约束核心结论、主要方案、优先级、禁忌或风险边界。</p>
      </div>
    </section>
    <div class="meta" id="meta"></div>
    <div class="workspace">
      <article class="content" id="content"></article>
      <aside class="audit" id="audit"></aside>
    </div>
  </main>
  <script>
    const records = __MEMCALIB_RECORDS_JSON__;
    let index = 0;
    const storageKey = 'memcalib-human-review-v2-bilingual';
    const legacySaved = JSON.parse(localStorage.getItem('memcalib-human-review-v1') || '{}');
    const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
    Object.entries(legacySaved).forEach(([answerId, value]) => { if (!saved[answerId]) saved[answerId] = {...value, atoms: value.atoms || {}}; });
    const rubricLabels = {
      allowed_memory_use: '允许的记忆用途', contamination_signals: '污染信号', controlling_factor: '控制因素',
      correct_use: '正确使用', expected_answer_behavior: '期望回答行为', failure_direction: '失败方向',
      forbidden_memory_role: '禁止承担的作用', maximum_footprint: '最大影响范围', memory_usage_weight: '使用权重',
      missing_memory_failure: '缺失记忆时的失败', observable_checks: '可观测检查项', over_use: '过度使用',
      under_use: '使用不足', validity_scope: '有效范围'
    };
    const verdictLabels = {
      correct_suppression: '正确抑制', correct_bounded_use: '正确有限使用', correct_control: '正确核心使用',
      over_use: '过度使用', under_use: '使用不足', unscorable: '不可评分'
    };
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const tr = (record, path) => record.translations_zh?.[path] || '【暂无中文译文】';
    const atomJudge = (row, atomId) => row?.atom_judgments?.find(item => item.atom_id === atomId);
    const atomJudgeIndex = (row, atomId) => row?.atom_judgments?.findIndex(item => item.atom_id === atomId) ?? -1;
    const bilingual = (english, chinese, extraClass='') => `<div class="bilingual ${extraClass}"><div class="language-pane"><span class="language-label">English · 正式原文</span><div class="text">${esc(english)}</div></div><div class="language-pane zh"><span class="language-label">中文 · 辅助译文</span><div class="text">${esc(chinese)}</div></div></div>`;

    function rubricValue(record, atomIndex, key, value) {
      const base = `atomic_memories.${atomIndex}.usage_rubric.${key}`;
      const english = Array.isArray(value) ? value.join(' · ') : value;
      const chinese = Array.isArray(value) ? value.map((_, itemIndex) => tr(record, `${base}.${itemIndex}`)).join(' · ') : tr(record, base);
      return `<div class="rubric-row"><div class="rubric-key">${esc(key)}<br>${esc(rubricLabels[key] || key)}</div><div class="rubric-value"><div>${esc(english)}</div><div class="zh-line">${esc(chinese)}</div></div></div>`;
    }

    function judgeCard(record, role, judgment, atom, peerLevel) {
      const item = atomJudge(judgment, atom.atom_id);
      if (!item) return `<div class="judge"><div class="judge-head"><strong>${role === 'primary_judgment' ? '主 Judge' : '复核 Judge'}</strong></div><div class="judge-meta">本条未评分</div></div>`;
      const itemIndex = atomJudgeIndex(judgment, atom.atom_id);
      const base = `${role}.atom_judgments.${itemIndex}`;
      const level = item.predicted_usage_level || '—';
      const disagree = peerLevel && peerLevel !== level ? ' disagree' : '';
      const title = role === 'primary_judgment' ? '主 Judge' : '复核 Judge';
      return `<div class="judge${disagree}"><div class="judge-head"><strong>${title} · ${esc(judgment.judge_model || '')}</strong><span class="prediction">预测 ${esc(level)}</span></div><div class="judge-meta">${esc(verdictLabels[item.verdict] || item.verdict || '')} · 置信度 ${esc(item.confidence ?? '—')} · contradiction ${item.contradiction ? '是' : '否'}</div><div class="judge-block"><b>Evidence quote · 证据</b><div>${esc(item.evidence_quote || '（无直接引文）')}</div><div class="zh-line">${esc(item.evidence_quote ? tr(record, `${base}.evidence_quote`) : '（无直接引文）')}</div></div><div class="judge-block"><b>Reason · 理由</b><div>${esc(item.reason || '')}</div><div class="zh-line">${esc(tr(record, `${base}.reason`))}</div></div></div>`;
    }

    function atomHtml(record, atom, atomIndex, current) {
      const primary = atomJudge(record.primary_judgment, atom.atom_id);
      const secondary = atomJudge(record.secondary_judgment, atom.atom_id);
      const atomSaved = current.atoms?.[atom.atom_id] || {};
      const comparisonUnlocked = Boolean(atomSaved.usage_level);
      const rubric = Object.entries(atom.usage_rubric || {}).map(([key, value]) => rubricValue(record, atomIndex, key, value)).join('');
      const evidence = atom.evidence ? bilingual(atom.evidence, tr(record, `atomic_memories.${atomIndex}.evidence`)) : '<div class="text">（无原始证据）</div>';
      const labelReason = atom.label_reason ? bilingual(atom.label_reason, tr(record, `atomic_memories.${atomIndex}.label_reason`)) : '<div class="text">（无标签理由）</div>';
      const comparison = comparisonUnlocked ? `<div class="judge-grid">${judgeCard(record, 'primary_judgment', record.primary_judgment, atom, secondary?.predicted_usage_level)}${judgeCard(record, 'secondary_judgment', record.secondary_judgment, atom, primary?.predicted_usage_level)}</div>` : '<div class="blind-comparison">完成“实际使用强度”后显示 Gold 与两个 Judge，避免人工判断受到锚定。</div>';
      return `<section class="atom"><header class="atom-head"><div><div class="atom-id">${esc(atom.atom_id)} · parent ${esc(atom.parent_memory_id)}</div><div class="atom-title">${esc(atom.text)}</div><div class="atom-title-zh">${esc(tr(record, `atomic_memories.${atomIndex}.text`))}</div></div><div class="gold"><small>${comparisonUnlocked ? '规范目标 Gold u*' : '先完成人工等级'}</small><strong>${comparisonUnlocked ? esc(atom.u_star) : '?'}</strong></div></header><div class="atom-body"><h3 class="rubric-title">Annotation basis · 标注依据</h3><div class="atom-basis"><div class="basis-card"><h4>Source evidence · 原始证据</h4>${evidence}<div class="basis-meta">source=${esc(atom.source || 'unknown')} · derivation=${esc(atom.derivation || 'unknown')}</div></div><div class="basis-card"><h4>Gold rationale · 标签理由</h4>${labelReason}<div class="basis-meta">type=${esc(atom.memory_type || 'unknown')} · subtype=${esc(atom.subtype || 'unknown')}</div></div></div><h3 class="rubric-title">Usage rubric · 使用判据</h3><div class="rubric-table">${rubric}</div><div class="human-atom"><div class="field"><label for="level-${esc(atom.atom_id)}">你的实际使用强度</label><select class="atom-level" data-atom="${esc(atom.atom_id)}" id="level-${esc(atom.atom_id)}"><option value="">未标注</option><option value="A" ${atomSaved.usage_level === 'A' ? 'selected' : ''}>A · 无可观测影响</option><option value="B" ${atomSaved.usage_level === 'B' ? 'selected' : ''}>B · 局部支持</option><option value="C" ${atomSaved.usage_level === 'C' ? 'selected' : ''}>C · 核心控制</option><option value="unscorable" ${atomSaved.usage_level === 'unscorable' ? 'selected' : ''}>无法评分</option></select><div class="help">先根据回答中的实际影响独立判断。选定后才显示 Gold 与 Judge；Gold u* 表示应该如何使用，不等于实际用了多少。</div></div><div class="field"><label for="contradiction-${esc(atom.atom_id)}">冲突类型</label><select class="atom-contradiction" data-atom="${esc(atom.atom_id)}" id="contradiction-${esc(atom.atom_id)}"><option value="">未标注</option><option value="no" ${atomSaved.contradiction === 'no' ? 'selected' : ''}>无冲突</option><option value="explicit_fact" ${atomSaved.contradiction === 'explicit_fact' ? 'selected' : ''}>明确陈述相反事实</option><option value="constraint_violation" ${atomSaved.contradiction === 'constraint_violation' ? 'selected' : ''}>行动或建议违反记忆约束</option><option value="both" ${atomSaved.contradiction === 'both' ? 'selected' : ''}>两者同时存在</option><option value="unclear" ${atomSaved.contradiction === 'unclear' ? 'selected' : ''}>口径不清 / 需讨论</option></select><div class="help">“未采用记忆”通常属于 A 或 under-use，不自动构成冲突。这里拆分两个正例口径供协议定稿。</div></div><div class="field"><label for="gold-${esc(atom.atom_id)}">Gold / rubric 质量</label><select class="atom-gold-quality" data-atom="${esc(atom.atom_id)}" id="gold-${esc(atom.atom_id)}"><option value="">未标注</option><option value="valid" ${atomSaved.gold_quality === 'valid' ? 'selected' : ''}>有效 · 标签清晰且 rubric 可执行</option><option value="revise" ${atomSaved.gold_quality === 'revise' ? 'selected' : ''}>需修订 · 方向合理但表述含糊</option><option value="invalid" ${atomSaved.gold_quality === 'invalid' ? 'selected' : ''}>无效 · Gold 或原子划分错误</option><option value="unclear" ${atomSaved.gold_quality === 'unclear' ? 'selected' : ''}>需要讨论</option></select><div class="help">根据原始证据、当前问题和 rubric 判断规范目标本身是否可靠。</div></div></div>${comparison}</div></section>`;
    }

    function persist(record) {
      const current = saved[record.answer_request_id] || {atoms: {}};
      current.atoms ||= {};
      document.querySelectorAll('.atom-level').forEach(element => {
        current.atoms[element.dataset.atom] ||= {};
        current.atoms[element.dataset.atom].usage_level = element.value;
      });
      document.querySelectorAll('.atom-contradiction').forEach(element => {
        current.atoms[element.dataset.atom] ||= {};
        current.atoms[element.dataset.atom].contradiction = element.value;
      });
      document.querySelectorAll('.atom-gold-quality').forEach(element => {
        current.atoms[element.dataset.atom] ||= {};
        current.atoms[element.dataset.atom].gold_quality = element.value;
      });
      current.decision = document.getElementById('decision')?.value || '';
      current.issue = document.getElementById('issue')?.value || '';
      current.note = document.getElementById('note')?.value || '';
      saved[record.answer_request_id] = current;
      localStorage.setItem(storageKey, JSON.stringify(saved));
      updateProgress(record, current);
    }

    function updateProgress(record, current) {
      const labeled = record.atomic_memories.filter(atom => current.atoms?.[atom.atom_id]?.usage_level).length;
      const progress = document.getElementById('atom-progress');
      if (progress) progress.innerHTML = `<strong>${labeled} / ${record.atomic_memories.length} 个原子已判定</strong><span>完成逐原子判定后，再填写整条审查结论。</span>`;
    }

    function render() {
      const record = records[index];
      const current = saved[record.answer_request_id] || {atoms: {}};
      document.getElementById('count').textContent = `${index + 1} / ${records.length}`;
      document.getElementById('identity').textContent = record.answer_request_id;
      const conditionLabel = record.condition === 'full_memory' ? 'Full memory · 模型看到记忆' : 'No memory · 模型未看到记忆';
      document.getElementById('meta').innerHTML = [record.review_stratum, record.panel, record.model_key, conditionLabel].map((value, itemIndex) => `<span class="tag ${itemIndex === 0 && record.review_stratum === 'diagnostic' ? 'attention' : ''}">${esc(value)}</span>`).join('');
      const memories = record.memory_blocks.map((memory, memoryIndex) => `<div class="memory-row"><div class="bilingual"><div class="language-pane"><span class="language-label">English · 正式原文</span><span class="memory-id">${esc(memory.parent_memory_id)}</span><span class="text">${esc(memory.memory_text)}</span></div><div class="language-pane zh"><span class="language-label">中文 · 辅助译文</span><span class="memory-id">${esc(memory.parent_memory_id)}</span><span class="text">${esc(tr(record, `memory_blocks.${memoryIndex}.memory_text`))}</span></div></div></div>`).join('');
      const conditionNote = record.condition === 'no_memory' ? '<div class="condition-note">本回答属于 no-memory 条件：下列记忆仅供评估者作为反事实参照，回答模型生成时没有看到它们。</div>' : '<div class="condition-note" style="border-left-color:var(--teal);background:var(--teal-soft);color:#155b55">本回答属于 full-memory 条件：下列非原子记忆块均展示给了回答模型。</div>';
      const atoms = record.atomic_memories.map((atom, atomIndex) => atomHtml(record, atom, atomIndex, current)).join('');
      document.getElementById('content').innerHTML = `<section class="section"><div class="section-title"><h2>当前问题 · Current query</h2><span>Answer input</span></div>${bilingual(record.question, tr(record, 'question'))}</section><section class="section"><div class="section-title"><h2>记忆块 · Memory blocks</h2><span>${record.condition === 'full_memory' ? 'Model-facing' : 'Evaluator reference only'}</span></div>${conditionNote}<div class="memory-list">${memories}</div></section><section class="section"><div class="section-title"><h2>模型回答 · Model response</h2><span>${esc(record.model_key)}</span></div>${bilingual(record.model_response, tr(record, 'model_response'))}<div class="translation-note">判定冲突、否定、程度和证据引文时，以左侧英文为准。</div></section><h2 class="atoms-heading">隐藏原子标注与 Judge 对照</h2>${atoms}`;
      document.getElementById('audit').innerHTML = `<h2>整条样本审查</h2><div class="legend"><div><b>1</b>独立判断每个原子的实际使用强度。</div><div><b>2</b>对照 Gold 与两个 Judge，定位边界分歧。</div><div><b>3</b>若 rubric 本身含糊，整条选择“需要修订”。</div></div><div class="progress" id="atom-progress"></div><div class="field"><label for="decision">自动评分是否可接受</label><select id="decision"><option value="">未标注</option><option value="accept">接受 · Judge 结论整体可用</option><option value="revise">需要修订 · 至少一个原子需改</option><option value="reject">拒绝 · 样本或 rubric 不可用</option><option value="unscorable">无法判断</option></select><div class="help">这里评价 Judge 评分是否可作为正式 benchmark 结果，不评价回答模型表现好坏。</div></div><div class="field"><label for="issue">主要问题</label><select id="issue"><option value="">无 / 未标注</option><option value="ab_boundary">A/B 边界不清</option><option value="bc_boundary">B/C 边界不清</option><option value="contradiction">contradiction 口径不清</option><option value="atom_verdict">Judge 原子等级错误</option><option value="rubric">rubric 不可操作或 Gold 可疑</option><option value="answer_quality">基础回答质量干扰</option><option value="judge_grounding">Judge 证据不充分</option><option value="sample_invalid">样本本身有问题</option></select></div><div class="field"><label for="note">备注</label><textarea id="note" placeholder="写明 atom_id、你的判断和理由；无问题可留空。"></textarea></div><button class="export" id="export">导出全部人工标注</button>`;
      document.getElementById('decision').value = current.decision || '';
      document.getElementById('issue').value = current.issue || '';
      document.getElementById('note').value = current.note || '';
      document.querySelectorAll('select, textarea').forEach(element => element.addEventListener('input', () => {
        persist(record);
        if (element.classList.contains('atom-level')) render();
      }));
      document.getElementById('export').onclick = exportData;
      document.getElementById('prev').disabled = index === 0;
      document.getElementById('next').disabled = index === records.length - 1;
      updateProgress(record, current);
    }

    function go(delta) {
      index = Math.max(0, Math.min(records.length - 1, index + delta));
      render();
      scrollTo(0, 0);
    }
    function exportData() {
      const payload = {schema_version: 'memcalib-calibration-human-annotation-v2', exported_at: new Date().toISOString(), annotations: saved};
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'memcalib-calibration-human-annotations.json';
      link.click();
      URL.revokeObjectURL(link.href);
    }
    document.getElementById('prev').onclick = () => go(-1);
    document.getElementById('next').onclick = () => go(1);
    addEventListener('keydown', event => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(event.target.tagName)) return;
      if (event.key === 'ArrowLeft') go(-1);
      if (event.key === 'ArrowRight') go(1);
    });
    render();
  </script>
</body>
</html>
