 and cause symptoms of Central pain and tightness. So stress management is very important in your case to relieve these symptoms. And for this, you should consult psychiatrist and get done counselling sessions. Try to identify stressor in your life and start working on its solution. You may need anxiolytic Chat Doctor. You should also start proton pump inhibitors. Don't worry, you will be alright. Hope I have solved your query. I will be happy to help you further. Wish you good health. Thanks.","deterministic_qc":{"schema_version":"crk2-deterministic-qc-v2","decision":"pass","query_lexical_overlap_audit":[{"atom_id":"p1_a1","flag":false,"coverage":0.0,"shared":[],"reason":"none"},{"atom_id":"p2_a1","flag":false,"coverage":0.0,"shared":[],"reason":"none"},{"atom_id":"p3_a1","flag":false,"coverage":0.1429,"shared":["work"],"reason":"none"},{"atom_id":"p3_a2","flag":false,"coverage":0.0,"shared":[],"reason":"none"},{"atom_id":"p4_a1","flag":false,"coverage":0.0,"shared":[],"reason":"none"}]},"independent_qc":{"schema_version":"crk-2-independent-qc-v2","decision":"strict_pass","declared_decision":"strict_pass","decision_reasons":[],"atom_checks":[{"atom_id":"p1_a1","query_relation":"absent","atomicity":"pass","label_action_validity":"pass","counterfactual_observability":"pass","rubric_judgeability":"pass","recommended_u_star":"B","recommended_memory_action":"apply","reason":"Demographics are not stated, paraphrased, or recoverable from the query. Single independent proposition. U* = B is correct: age/gender/BMI contextualize risk but do not control the core conclusion. Counterfactual is observable via mentions of '31', 'male', 'BMI', 'weight', or connecting demographics to GERD/MSK likelihood. Rubric clearly distinguishes correct use (contextualizes risk) from under-use (generic advice) and over-use (excessive focus on weight loss)."},{"atom_id":"p2_a1","query_relation":"absent","atomicity":"pass","label_action_validity":"pass","counterfactual_observability":"pass","rub   function expertView(r){const a=r.expert_audit,findings=arr(a.findings),advisory=a.decision==="accept",dimClass=advisory?"advisory-dimension":"dimension",actionLabel=advisory?"建议":"修订";return `<section class="expert"><div class="verdict ${esc(a.decision)}"><div class="eyebrow">Expert decision</div><strong>${esc(a.decision)}</strong><div class="severity">severity: ${esc(a.severity)}<br>prior QC: ${esc(r.prior_qc_decision)}</div></div><div class="audit-body"><div class="audit-summary">${esc(a.summary_cn)}</div><div class="dimension-row">${arr(a.review_dimensions).map(x=>`<span class="${dimClass}">${esc(x)} · ${advisory?"advisory":"blocking"}</span>`).join("")||'<span class="badge accept">no blocking issue</span>'}</div>${findings.map(f=>`<div class="finding"><div class="finding-key">${esc(arr(f.atoms).join(" + "))}<br>${esc(f.type)}</div><div class="finding-text"><b>${esc(f.finding_cn)}</b><p class="recommendation">${actionLabel}：${esc(f.action_cn)}</p></div></div>`).join("")}</div></section>`}
  function qcAtomView(q){const fields=[["query",q.query_relation,q.query_relation!=="absent"],["atomic",q.atomicity,q.atomicity!=="pass"],["label/action",q.label_action_validity,q.label_action_validity==="fail"],["counterfactual",q.counterfactual_observability,q.counterfactual_observability!=="pass"],["rubric",q.rubric_judgeability,q.rubric_judgeability==="fail"]];return `<div class="qc-atom"><div class="mini-row">${fields.map(x=>`<span class="mini ${x[2]?"fail":""}">${esc(x[0])}: ${esc(x[1])}</span>`).join("")}</div><div>${esc(q.reason)}</div><div class="muted">QC 推荐：${esc(q.recommended_u_star)} / ${esc(q.recommended_memory_action)}</div></div>`}
  function rubricView(r){return `<div class="rubric"><h3>Judge rubric · 完整判分规则</h3>${kvRows(r,["expected_answer_behavior","memory_usage_weight","validity_scope","correct_use","under_use","over_use","forbidden_memory_role","failure_direction","observable_checks"])}</div>`}
  function atomView(m,qcMap,findingMap,advisory){const id=m.atom_id||m.memory_id,c=obj(m.counterfactual_contract),t=obj(m.construction_target),q=qcMap[id],findings=findingMap[id]||[],flagClass=findings.length?(advisory?"advisory-flagged":"flagged"):"",actionLabel=advisory?"建议":"修订";return `<article class="atom ${flagClass}"><div class="atom-head"><span class="atom-id">${esc(id)}</span>${badge(m.u_star,"label-"+String(m.u_star||"").toLowerCase())}${badge(m.memory_action,"action-"+m.memory_action)}${badge(m.source,"source")}</div><div class="predicate">${esc(m.text||m.atomic_predicate)}</div>${findings.map(f=>`<div class="atom-finding ${advisory?"advisory":""}"><b>${advisory?"非阻断建议":"阻断问题"} · ${esc(f.type)}</b>${esc(f.finding_cn)}<br><span class="recommendation">${actionLabel}：${esc(f.action_cn)}</span></div>`).join("")}${kvRows(m,["evidence","atomic_predicate","derivation","memory_type","subtype","hard_a_family","label_reason"])}<details><summary>Construction target · 构建目标</summary>${kvRows(t,["task_goal","memory_role","usage_boundary","failure_direction"])}</details><div class="contract"><div><strong>WITHOUT MEMORY</strong>${esc(c.without_memory_behavior)}</div><div><strong>WITH MEMORY</strong>${esc(c.with_memory_behavior)}</div><div class="delta"><strong>OBSERVABLE DELTA</strong>${esc(c.observable_delta)}<br><b>Minimal evidence:</b> ${arr(c.minimal_evidence).map(esc).join(" · ")||"none"}</div></div>${rubricView(m.usage_rubric)}${q?`<details><summary>Independent QC · 独立原子复核</summary>${qcAtomView(q)}</details>`:""}</article>`}
  function parentView(p,memories,qcMap,findingMap,advisory){return `<section class="parent"><div class="parent-head"><div><div class="eyebrow">Parent memory · ${esc(p.parent_memory_id)}</div><div class="parent-title">${esc(p.memory_text)}</div></div>${badge(p.source,"source")}</div><div class="evidence"><b>Raw evidence</b><br>${esc(p.raw_evidence)}</div><div class="atom-note">Atomization note: ${esc(p.atomization_notes)}</div><div class="atoms">${memories.map(m=>atomView(m,qcMap,findingMap,advisory)).join("")}</div></section>`}
  function render(){if(!filtered.length){document.getElementById("root").innerHTML='<div class="empty">当前筛选没有样本</div>';return}cursor=Math.max(0,Math.min(cursor,filtered.length-1));const r=filtered[cursor],a=r.expert_audit,advisory=a.decision==="accept",qc=obj(r.independent_qc),qcMap=Object.fromEntries(arr(qc.atom_checks).map(x=>[x.atom_id,x])),findingMap={};arr(a.findings).forEach(f=>arr(f.atoms).forEach(id=>(findingMap[id]??=[]).push(f)));const byParent={};arr(r.memories).forEach(m=>(byParent[m.parent_memory_id]??=[]).push(m));document.getElementById("position").textContent=`${cursor+1} / ${filtered.length}`;document.getElementById("recordId").textContent=r.id;document.getElementById("jump").max=filtered.length;document.getElementById("jump").value=cursor+1;document.getElementById("prev").disabled=cursor===0;document.getElementById("next").disabled=cursor===filtered.length-1;document.getElementById("root").innerHTML=`<article class="sample"><header class="sample-head"><div class="verdict-rail ${esc(a.decision)}"></div><div class="question"><div class="eyebrow">Model-facing question</div><h1>${esc(r.question)}</h1></div><div class="badges">${badge(a.decision,a.decision)}${badge(r.prior_qc_decision,r.prior_qc_decision)}${badge(r.source_dataset,"source")}</div></header>${expertView(r)}<section class="band"><div class="section-title"><h2>源数据与去背景化任务</h2><span>${esc(r.source_topic)}</span></div><div class="source-grid"><div><div class="eyebrow">Raw query</div><div class="text">${esc(r.raw_query)}</div></div><div><div class="eyebrow">Source answer · 只用于证据审计</div><div class="text muted">${esc(r.source_answer)}</div></div></div></section><section class="band"><div class="section-title"><h2>模型可见记忆与隐藏原子标注</h2><span>${arr(r.memory_blocks).length} parents · ${arr(r.memories).length} atoms</span></div>${arr(r.memory_blocks).map(p=>parentView(p,byParent[p.parent_memory_id]||[],qcMap,findingMap,advisory)).join("")}</section><section class="band qc"><div class="section-title"><h2>独立 QC 与专家复核差异</h2><span>${esc(a.qc_rationale_assessment)}</span></div><div class="qc-grid"><div class="qc-call"><div class="eyebrow">Independent QC</div><strong>${esc(qc.decision)}</strong><div>${arr(qc.decision_reasons).map(esc).join(" · ")||"no reject reason"}</div></div><div class="qc-note"><b>专家对 QC 理由的判断：${esc(a.qc_rationale_assessment)}</b><br>${esc(a.qc_rationale_note_cn)}</div></div><details><summary>查看全部原子对复核</summary>${arr(qc.pair_checks).map(p=>`<div class="qc-atom"><b>${esc(p.left_atom_id)} ↔ ${esc(p.right_atom_id)}</b> · ${esc(p.relation)}<br>${esc(p.reason)}</div>`).join("")}</details></section></article>`;location.hash=encodeURIComponent(r.id)}
  function move(delta){if(!filtered.length)return;cursor=Math.max(0,Math.min(filtered.length-1,cursor+delta));render();scrollTo({top:0,behavior:"instant"})}
  function applyFilters(){const e=document.getElementById("expertFilter").value,q=document.getElementById("qcFilter").value;filtered=records.filter(r=>(e==="all"||r.expert_audit.decision===e)&&(q==="all"||r.prior_qc_decision===q));cursor=0;render()}
  document.getElementById("prev").onclick=()=>move(-1);document.getElementById("next").onclick=()=>move(1);document.getElementById("expertFilter").onchange=applyFilters;document.getElementById("qcFilter").onchange=applyFilters;document.getElementById("go").onclick=()=>{const n=Number(document.getElementById("jump").value);if(Number.isFinite(n)){cursor=n-1;render()}};document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))return;if(e.key==="ArrowLeft"||e.key==="k")move(-1);if(e.key==="ArrowRight"||e.key==="j")move(1)});const initial=decodeURIComponent(location.hash.slice(1)),initialIndex=records.findIndex(r=>r.id===initial);if(initialIndex>=0)cursor=initialIndex;renderOverview();render();
  </script>
</body>
